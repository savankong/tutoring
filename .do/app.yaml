# DigitalOcean App Platform spec for Cambo App.
#
# Values marked SECRET are set in the DO dashboard (App > Settings >
# App-Level Environment Variables), never committed here. See CLAUDE.md's
# "Hosting (DigitalOcean App Platform)" section for the full deploy runbook.
name: cambo-app
region: nyc
services:
  - name: web
    github:
      repo: savankong/tutoring
      branch: main
      deploy_on_push: true
    build_command: npm ci && npm run build
    run_command: npm start
    environment_slug: node-js
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
    http_port: 8080
    health_check:
      http_path: /
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: JWT_SECRET
        type: SECRET
      - key: STRIPE_SECRET_KEY
        type: SECRET
      - key: STRIPE_WEBHOOK_SECRET
        type: SECRET
      - key: STRIPE_PRICE_ID
        type: SECRET
      - key: STRIPE_PRICE_STARTER
        type: SECRET
      - key: STRIPE_PRICE_PERSONAL
        type: SECRET
      - key: STRIPE_PRICE_PRO
        type: SECRET
      - key: STRIPE_PRICE_CREDIT_PACK
        type: SECRET
      - key: STRIPE_PRICE_PASS_24H
        type: SECRET
      - key: STRIPE_PRICE_PASS_7D
        type: SECRET
      - key: STRIPE_PRICE_PASS_30D
        type: SECRET
      - key: GOOGLE_CLIENT_ID
        type: SECRET
      - key: GOOGLE_CLIENT_SECRET
        type: SECRET
      - key: RESEND_API_KEY
        type: SECRET
      - key: ANTHROPIC_API_KEY
        type: SECRET
domains:
  - domain: camboapp.com
    type: PRIMARY
