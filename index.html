<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Cambo App</title>

    <!-- Open Graph / social link previews -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.camboapp.com/" />
    <meta property="og:title" content="Cambo App" />
    <meta property="og:description" content="Snap a photo of any problem, get answers, and explanations." />
    <meta property="og:image" content="https://www.camboapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cambo App" />
    <meta name="twitter:description" content="Snap a photo of any problem, get answers, and explanations." />
    <meta name="twitter:image" content="https://www.camboapp.com/og-image.png" />

    <!-- Add to Home Screen -> launches full screen, no browser chrome.
         No page can force this for a regular browser tab; this is the
         actual mechanism browsers offer for a chrome-less "app" view. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#1d1d1f" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cambo App" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
