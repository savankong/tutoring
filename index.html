<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Fallback title/description for routes that don't render a <Seo> block
         (protected app pages) and for the pre-hydration paint. Public marketing
         routes (/, /pricing, /login, /register) override these via <Seo>. -->
    <title>Cambo App</title>
    <meta name="description" content="Snap a photo of any problem, get answers, and explanations." />

    <!-- Open Graph / social link previews. Page-specific title/description/url
         are supplied per-route by <Seo>; only page-independent fields live here. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://camboapp.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://camboapp.com/og-image.png" />

    <!-- Add to Home Screen -> launches full screen, no browser chrome.
         No page can force this for a regular browser tab; this is the
         actual mechanism browsers offer for a chrome-less "app" view. -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#111208" />
    <link rel="apple-touch-icon" href="/icons/icon-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cambo App" />

    <!-- Plausible analytics, site-wide (also covers the landing pages'
         event-name/event-* CTA tracking via the same script). -->
    <script async src="https://plausible.io/js/pa-q_udJRciP4RoryL1Fe69D.js"></script>
    <script>
      window.plausible=window.plausible||function(){(plausible.q=plausible.q||[]).push(arguments)},plausible.init=plausible.init||function(i){plausible.o=i||{}};
      plausible.init()
    </script>
  </head>
  <body>
    <div id="root"></div>

    <!-- Hidden Netlify Forms registration. Netlify's build-time crawler only
         detects <form data-netlify> markup that's literally present in a
         deployed HTML file — it never runs the SPA's JS. /account (the real
         "help" form's home) is never prerendered, so its form would
         otherwise be invisible to that crawler. Living here, outside
         #root, this survives untouched through both the plain Vite build
         and prerender.mjs's template.replace() (which only touches
         '<div id="root"></div>' and the <head> tags), so it's present in
         every deployed HTML file site-wide regardless of which page's real,
         JS-rendered form actually POSTs to it at runtime — see
         src/lib/netlifyForms.js for that submission helper.
         Field names here must exactly match the fields submitted by
         Contact.jsx (form "question") and Account.jsx (form "help"). -->
    <form name="question" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="name" />
      <input type="email" name="email" />
      <textarea name="question"></textarea>
    </form>
    <form name="help" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="email" name="email" />
      <input type="text" name="subject" />
      <textarea name="message"></textarea>
    </form>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
