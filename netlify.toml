[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# /contact was a standalone page briefly — now inlined as the #ask section
# on the homepage. Keep this so the short-lived URL doesn't 404/dead-end.
[[redirects]]
  from = "/contact"
  to = "/#ask"
  status = 301

# SPA fallback so client-side routes (/app, /history, /account, ...) survive
# a direct load or refresh. Real files and function paths are matched first
# and are unaffected by this.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
